<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joy億LABO｜アーカイブ一覧</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background-color: #fff8f0;
      color: #333;
    }

    /* ===== パスワード画面 ===== */
    #pw-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(160deg, #c47d00, #e8a000, #ffdd00, #b06800);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    #pw-screen h2 {
      color: white;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(100,50,0,0.5);
    }

    #pw-screen p {
      color: rgba(255,255,255,0.9);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    #pw-input {
      width: 100%;
      max-width: 300px;
      padding: 14px 16px;
      font-size: 1.1rem;
      border: none;
      border-radius: 10px;
      text-align: center;
      outline: none;
      margin-bottom: 16px;
      letter-spacing: 0.1em;
    }

    #pw-btn {
      width: 100%;
      max-width: 300px;
      padding: 14px;
      background: #3d2000;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 0.1em;
    }

    #pw-btn:active {
      opacity: 0.8;
    }

    #pw-error {
      color: #fff;
      background: rgba(180,0,0,0.6);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
    }

    /* ===== スマホ対応 ===== */
    @media (max-width: 600px) {
      header h1 { font-size: 2rem; }
      header p { font-size: 1rem; }
      .grid, .ref-grid { grid-template-columns: 1fr; }
    }

    /* ===== キラキラ金色ヘッダー ===== */
    header {
      position: relative;
      background: linear-gradient(160deg, #c47d00 0%, #e8a000 20%, #f5c400 40%, #ffdd00 50%, #e8a000 70%, #b06800 100%);
      text-align: center;
      padding: 60px 20px;
      overflow: hidden;
    }

    /* 斜めの光の筋 */
    header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -20%;
      width: 60%;
      height: 200%;
      background: linear-gradient(
        105deg,
        transparent 30%,
        rgba(255,255,200,0.35) 45%,
        rgba(255,255,255,0.5) 50%,
        rgba(255,255,200,0.35) 55%,
        transparent 70%
      );
      animation: lightBeam 4s ease-in-out infinite;
    }

    header::after {
      content: '';
      position: absolute;
      top: -50%;
      left: 10%;
      width: 40%;
      height: 200%;
      background: linear-gradient(
        105deg,
        transparent 30%,
        rgba(255,255,180,0.2) 45%,
        rgba(255,255,255,0.35) 50%,
        rgba(255,255,180,0.2) 55%,
        transparent 70%
      );
      animation: lightBeam 4s ease-in-out 1.5s infinite;
    }

    @keyframes lightBeam {
      0%   { transform: translateX(-30%) skewX(-10deg); opacity: 0; }
      20%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateX(180%) skewX(-10deg); opacity: 0; }
    }

    header h1 {
      position: relative;
      font-size: 3rem;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      color: white;
      text-shadow:
        0 2px 8px rgba(100,50,0,0.5),
        0 0 30px rgba(255,200,0,0.4);
      font-weight: 900;
    }

    header p {
      position: relative;
      font-size: 1.3rem;
      font-weight: bold;
      color: white;
      letter-spacing: 0.2em;
      text-shadow:
        0 2px 6px rgba(100,50,0,0.5),
        0 0 20px rgba(255,200,0,0.3);
    }

    /* ===== レイアウト ===== */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .count {
      text-align: right;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 32px;
    }

    .video-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      transition: transform 0.2s;
    }

    .video-card:hover {
      transform: translateY(-4px);
    }

    .thumbnail-link {
      display: block;
      position: relative;
    }

    .video-thumbnail {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
    }

    .thumbnail-link::after {
      content: '▶';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5rem;
      color: white;
      background: rgba(0,0,0,0.55);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      line-height: 60px;
      text-align: center;
      pointer-events: none;
    }

    /* ===== 講座資料 ===== */
    .materials {
      max-width: 1100px;
      margin: 0 auto 50px;
      padding: 0 20px;
    }

    .materials h2 {
      font-size: 1.2rem;
      color: #b8860b;
      border-left: 4px solid #b8860b;
      padding-left: 12px;
      margin-bottom: 20px;
    }

    .material-list {
      list-style: none;
      padding: 0 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .material-list li a {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff8f0;
      border-radius: 8px;
      padding: 10px 14px;
      text-decoration: none;
      color: #333;
      font-size: 0.85rem;
      transition: background 0.15s;
    }

    .material-list li a:hover {
      background: #ffe8cc;
    }

    .material-list li a::before {
      content: '📄';
      font-size: 1rem;
      flex-shrink: 0;
    }

    /* ===== 参考動画セクション ===== */
    .ref-section {
      max-width: 1100px;
      margin: 0 auto 50px;
      padding: 0 20px;
    }

    .ref-section h2 {
      font-size: 1.2rem;
      color: #b8860b;
      border-left: 4px solid #b8860b;
      padding-left: 12px;
      margin-bottom: 20px;
    }

    .ref-section h3 {
      font-size: 1rem;
      color: #555;
      margin-bottom: 16px;
      padding-bottom: 6px;
      border-bottom: 1px solid #e8d5a3;
    }

    .ref-category {
      margin-bottom: 40px;
    }

    .ref-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 32px;
    }

    .ref-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      transition: transform 0.2s;
    }

    .ref-card:hover {
      transform: translateY(-4px);
    }

    .ref-wrapper {
      position: relative;
      padding-top: 56.25%;
    }

    .ref-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .ref-title {
      padding: 12px 16px 16px;
      font-size: 0.9rem;
      color: #333;
      line-height: 1.5;
    }

    .video-label {
      padding: 10px 16px 4px;
      font-size: 0.75rem;
      color: #b8860b;
      font-weight: bold;
    }

    .video-title {
      padding: 0 16px 16px;
      font-size: 0.9rem;
      color: #333;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>

  <script>
    const correct = 'joy';

    // 認証済みならパスワード画面を非表示
    if (localStorage.getItem('joyauth') === correct) {
      document.getElementById('pw-screen').style.display = 'none';
    }

    function checkPw() {
      const val = document.getElementById('pw-input').value;
      if (val === correct) {
        localStorage.setItem('joyauth', correct);
        document.getElementById('pw-screen').style.display = 'none';
      } else {
        document.getElementById('pw-error').style.display = 'block';
        document.getElementById('pw-input').value = '';
      }
    }

    // Enterキーでも送信
    document.getElementById('pw-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkPw();
    });

    const cards = document.querySelectorAll('.video-card');
    document.getElementById('videoCount').textContent = '全 ' + cards.length + ' 本';
  </script>
